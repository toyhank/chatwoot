name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ] # 当 main 分支有代码提交时触发
  workflow_dispatch:      # 允许手动点击按钮触发

env:
  REGISTRY: ghcr.io
  # 镜像名自动生成为: ghcr.io/用户名/仓库名 (全小写)
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 任务一：构建并推送镜像
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ✅✅✅ 补上这一步！这是解决报错的关键
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_SHA=${{ github.sha }}

  # 任务二：部署到服务器
  deploy:
    needs: build-and-push # 等待构建成功后才执行
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          # 将 GitHub 的 Commit SHA 注入到脚本中
          envs: GITHUB_SHA
          script: |
            # --- 1. 变量准备 ---
            # 定义镜像基础名 (必须全小写)
            # tr '[:upper:]' '[:lower:]' 是为了防止用户名有大写导致 Docker 报错
            IMAGE_BASE=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            
            # 截取 SHA 前 7 位 (例如 8a7d9f2)
            SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)
            
            # 拼接完整的新镜像 Tag
            NEW_IMAGE="${IMAGE_BASE}:sha-${SHORT_SHA}"
            
            echo "🚀 正在部署版本: $NEW_IMAGE"
            
            # --- 2. 进入项目目录 ---
            # ⚠️ 请修改为你服务器的实际路径
            cd /root/chatwoot
            
            # --- 3. 修改 docker-compose.yaml ---
            # 使用 sed 查找并替换 image 字段
            # 逻辑：找到以 "image: ghcr.io/..." 开头的行，替换为新版本
            sed -i "s|image: ${IMAGE_BASE}:.*|image: ${NEW_IMAGE}|g" docker-compose.yaml
            
            # 打印一下修改结果确认
            echo "配置文件已更新："
            grep "image:" docker-compose.yaml
            
            # --- 4. 拉取并重启 ---
            docker compose pull
            docker compose up -d
            
            # --- 5. 运行数据库迁移 ---
            echo "🔄 正在运行数据库迁移..."
            docker compose exec -T rails bundle exec rails db:migrate
            echo "✅ 数据库迁移完成"
            
            # --- 6. 清理旧镜像 (释放磁盘空间) ---
            docker image prune -f
            
            echo "✅ 部署完成！"